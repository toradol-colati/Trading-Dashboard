name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/news-intelligence
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ugt-terminal/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ugt-terminal/ui
        run: npm ci

      - name: Build UI
        working-directory: ugt-terminal/ui
        run: npm run build
        env:
          VITE_BASE_PATH: /Trading-Dashboard/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ugt-terminal/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
