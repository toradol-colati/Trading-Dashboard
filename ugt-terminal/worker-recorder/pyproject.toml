[project]
name = "worker-recorder"
version = "0.1.0"
description = "UGT M0: persists the live price stream, aggregates hourly sentiment, collects daily history"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "aiohttp>=3.8.0",
    "redis>=5.0.0",
    "asyncpg>=0.28.0",
    "apscheduler>=3.10.0,<4",
    "structlog>=23.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
